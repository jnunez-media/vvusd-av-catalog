<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VVUSD Audio/Video Equipment Catalog 2026–2027</title>
<meta name="description" content="Val Verde Unified School District — Audio/Video Equipment Catalog, 2026–2027. Browse audio, video, peripherals, and miscellaneous production equipment.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">VVUSD <span class="gold">A/V Catalog</span></div>
  <div class="pageinfo" id="topPageInfo"></div>
</header>

<div id="stage">
  <div class="book-wrap" id="book-wrap">
    <div id="book">
      <div class="book-shadow"></div>
      <div class="static-panel left"></div>
      <div class="static-panel right"></div>
      <div class="spine-shadow"></div>
      <!-- leaves injected by app.js -->
      <div class="nav-zone left"><span class="corner-arrow">&#8592;</span></div>
      <div class="nav-zone right"><span class="corner-arrow">&#8594;</span></div>
    </div>
  </div>
</div>

<div class="toolbar">
  <button class="icon-btn" id="zoomOutBtn" title="Zoom out">&#8722;</button>
  <button class="icon-btn" id="zoomInBtn" title="Zoom in">&#43;</button>
  <button class="icon-btn" id="gridBtn" title="Page thumbnails">&#9638;</button>
  <button class="icon-btn" id="prevBtn" title="Previous page">&#8592;</button>
  <input type="range" id="pageSlider" min="0" max="1" value="0" step="1">
  <span class="page-count" id="pageCount">1 / 1</span>
  <button class="icon-btn" id="nextBtn" title="Next page">&#8594;</button>
  <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">&#9974;</button>
</div>

<div id="thumbGrid">
  <button class="thumb-close" id="thumbClose">&#215;</button>
  <div class="thumb-grid-inner" id="thumbGridInner"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
